<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Wheel - Random Name Picker & Team Draw</title>
  <meta name="description" content="Minimalist lucky wheel web app for random name picking, team raffles, and customized draws with physics sound and confetti effects.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css?v=14">
  <link rel="stylesheet" href="styles/wheel.css?v=14">
  <link rel="stylesheet" href="styles/modal.css?v=14">
</head>
<body>
  <div class="app-layout">
    <!-- Floating Top-Left Date Pill -->
    <div class="floating-top-left">
      <div class="pill-badge" id="floatingDatePill">
        <span id="datePillText">Mon, Aug 24</span>
      </div>
    </div>

    <!-- Floating Top-Right Action Buttons (Sound + History) -->
    <div class="floating-top-right">
      <button id="soundToggleBtn" class="circle-btn" data-tooltip="Mute Sound" aria-label="Toggle Sound">
        <svg id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="soundIconOff" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <button id="historyCircleBtn" class="circle-btn" data-tooltip="Draw History" aria-label="Draw History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
    </div>

    <!-- Floating Bottom-Left Shortcut Prompts -->
    <div class="floating-bottom-left">
      <div class="control-prompts">
        <div class="prompt-row">
          <kbd class="key-badge">R</kbd>
          <span class="prompt-label">shuffle</span>
        </div>
        <div class="prompt-row">
          <kbd class="key-badge">SPACE</kbd>
          <span class="prompt-label">spin the wheel</span>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Left Floating Sidebar (NO background window box!) -->
      <aside class="floating-sidebar">

        <!-- CANDIDATES & ACTIONS -->
        <div class="control-section candidates-section">
          <div class="section-header-row">
            <div class="section-header-left">
              <span class="section-label">CANDIDATES</span>
              <span class="stat-pill" id="namesStatPill">
                <span id="activeNamesCount">0</span> / <span id="totalNamesCount">0</span>
              </span>
            </div>

            <!-- Action Circle Buttons (Select All, Deselect All, Shuffle) -->
            <div class="action-circle-group">
              <button type="button" id="selectAllBtn" class="circle-action-btn" data-tooltip="Select All" aria-label="Select All">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="18 6 7 17 2 12"></polyline>
                  <polyline points="22 10 15.5 16.5"></polyline>
                </svg>
              </button>
              <button type="button" id="deselectAllBtn" class="circle-action-btn" data-tooltip="Deselect All" aria-label="Deselect All">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button type="button" id="shuffleBtn" class="circle-action-btn" data-tooltip="Shuffle" aria-label="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 3 21 3 21 8"></polyline>
                  <line x1="4" y1="20" x2="21" y2="3"></line>
                  <polyline points="21 16 21 21 16 21"></polyline>
                  <line x1="15" y1="15" x2="21" y2="21"></line>
                  <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- Scrollable Avatar Grid -->
          <div class="names-list-wrapper">
            <ul id="namesList" class="names-grid" aria-label="Candidate list">
              <!-- Dynamically populated avatar chips -->
            </ul>
            <!-- Empty State View -->
            <div id="emptyListState" class="empty-state hidden">
              <div class="empty-icon">👥</div>
              <p>No candidates available</p>
              <span>Click "Select All" or add a new candidate</span>
            </div>
          </div>

          <!-- Quick Add Form -->
          <form id="addNameForm" class="add-name-form">
            <div class="pill-input-group">
              <input type="text" id="newNameInput" placeholder="Enter a name..." maxlength="30" autocomplete="off" />
              <button type="submit" id="addNameBtn" class="pill-add-btn" title="Add Member">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add</span>
              </button>
            </div>
          </form>
        </div>
      </aside>

      <!-- Center Wheel Stage -->
      <section class="wheel-stage-container">
        <div class="wheel-stage">
          <!-- Pointer Indicator -->
          <div class="pointer-wrapper">
            <div id="wheelPointer" class="wheel-pointer">
              <div class="pointer-needle"></div>
              <div class="pointer-cap"></div>
            </div>
          </div>

          <!-- Wheel Outer Ring & Canvas -->
          <div class="wheel-outer-ring" id="wheelOuterRing">
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
            
            <!-- Center Hub -->
            <div class="wheel-center-hub" id="wheelCenterHub">
              <div class="hub-inner"></div>
            </div>
          </div>
        </div>

        <!-- Spin Button Floating Controls -->
        <div class="spin-controls">
          <button id="spinBtn" class="floating-spin-btn" aria-label="Click to Spin">
            <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
            <span id="spinBtnText">Spin Now</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Winner Modal -->
  <div id="winnerModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="winnerModalTitle">
    <div class="modal-card winner-card">
      <h3 id="winnerModalTitle" class="winner-title">We have a winner!</h3>
      
      <!-- Winner Avatar -->
      <div class="winner-avatar-container">
        <div class="winner-avatar" id="winnerAvatar">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Winner Name -->
      <div id="winnerName" class="winner-name">Winner</div>

      <!-- Action Buttons (Close & Remove) -->
      <div class="winner-modal-actions">
        <button id="winnerCloseBtn" class="winner-action-btn btn-close" type="button">Close</button>
        <button id="winnerRemoveBtn" class="winner-action-btn btn-remove" type="button">Remove</button>
      </div>
    </div>
  </div>

  <!-- History Drawer -->
  <div id="historyDrawer" class="drawer-overlay hidden">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <h3>Draw History</h3>
        </div>
        <button id="closeHistoryBtn" class="close-icon-btn" aria-label="Close drawer">✕</button>
      </div>

      <div class="drawer-body">
        <div id="historyList" class="history-session-list">
          <!-- Populated by JS -->
        </div>
        <div id="historyEmptyState" class="empty-state">
          <div class="empty-icon">📜</div>
          <p>No draw history yet</p>
          <span>Spin the wheel to start your first round!</span>
        </div>
      </div>

      <div class="drawer-footer">
        <button id="clearHistoryBtn" class="clear-history-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear History
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Canvas for Confetti Fireworks -->
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <!-- Scripts -->
  <script src="js/members.js?v=14"></script>
  <script src="js/audio.js?v=14"></script>
  <script src="js/confetti.js?v=14"></script>
  <script src="js/wheel.js?v=14"></script>
  <script src="js/names.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
